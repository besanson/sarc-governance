  <circle cx="72" cy="32" r="5" fill="#3B82F6" stroke="#E2E8F0" stroke-width="1.2"/>
  <circle cx="62" cy="50" r="5" fill="#3B82F6" stroke="#E2E8F0" stroke-width="1.2"/>
